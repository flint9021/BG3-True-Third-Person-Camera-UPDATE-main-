name: Build DLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Build Release DLL
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          if (Test-Path "$env:VCPKG_ROOT\.git") {
            git -C "$env:VCPKG_ROOT" pull --quiet
          }
          cmake --preset REL -B build
          cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: TrueThirdPersonCamera-DLL
          path: build/Release/TrueThirdPersonCamera.dll
